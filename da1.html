<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trộn & Lọc Khối</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #0056b3;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .block {
            padding: 20px;
            background: white;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .type-a { border-left: 6px solid red; }
        .type-b { border-left: 6px solid green; }
        .type-c { border-left: 6px solid blue; }
    </style>
</head>
<body>

<h1>Trộn các khối & Lọc theo danh sách</h1>

<div class="buttons">
    <button onclick="showAll()">Tất cả</button>
    <button onclick="filterBlocks('a')">Khối A</button>
    <button onclick="filterBlocks('b')">Khối B</button>
    <button onclick="filterBlocks('c')">Khối C</button>
    <button onclick="shuffleBlocks()">Trộn lại</button>
</div>

<div class="container" id="blockContainer">
    <div class="block type-a" data-type="a">Khối A1</div>
    <div class="block type-b" data-type="b">Khối B1</div>
    <div class="block type-c" data-type="c">Khối C1</div>
    <div class="block type-a" data-type="a">Khối A2</div>
    <div class="block type-b" data-type="b">Khối B2</div>
    <div class="block type-c" data-type="c">Khối C2</div>
    <div class="block type-a" data-type="a">Khối A3</div>
    <div class="block type-b" data-type="b">Khối B3</div>
</div>

<script>
    const container = document.getElementById("blockContainer");

    function shuffleBlocks() {
        const blocks = Array.from(container.children);
        for (let i = blocks.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
        }
        blocks.forEach(block => container.appendChild(block));
    }

    function filterBlocks(type) {
        const blocks = container.children;
        for (let block of blocks) {
            block.style.display =
                block.getAttribute("data-type") === type ? "block" : "none";
        }
    }

    function showAll() {
        const blocks = container.children;
        for (let block of blocks) {
            block.style.display = "block";
        }
    }

    // Trộn ngay khi load trang
    shuffleBlocks();
</script>

</body>
